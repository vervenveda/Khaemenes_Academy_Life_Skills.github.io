name: Grade 7 Culinary source audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'courses/culinary-independence/middle/grade-7/**'
      - 'tools/audit_grade7_culinary.py'
      - 'tools/test_grade7_culinary_browser.spec.cjs'
      - '.github/workflows/grade7-culinary-audit.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Grade 7 Culinary learner journey contracts
        run: python3 tools/audit_grade7_culinary.py > grade7-culinary-source-audit.json
      - name: Check classroom JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          root=Path("courses/culinary-independence/middle/grade-7")
          for page in sorted(root.glob("week-*/index.html")):
              scripts=re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>",page.read_text(),flags=re.S|re.I)
              for n,script in enumerate(scripts):
                  p=Path("/tmp/grade7-culinary-check.js")
                  p.write_text(script)
                  subprocess.run(["node","--check",str(p)],check=True)
                  print(f"PASS {page} script {n+1}")
          PY
      - name: Install isolated browser test runner
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.58.2
          npx playwright install --with-deps chromium
      - name: Browser-test three-week learner journey
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/grade7-culinary-http.log 2>&1 &
          npx playwright test tools/test_grade7_culinary_browser.spec.cjs --browser chromium --workers 1 --reporter line
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade7-culinary-audit
          path: grade7-culinary-source-audit.json
          if-no-files-found: warn
