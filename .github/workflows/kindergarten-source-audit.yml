name: Life Skills kindergarten source audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'courses/kindergarten/**'
      - 'tools/audit_kindergarten.py'
      - 'tools/audit_kindergarten_import_identity.py'
      - 'tools/audit_kindergarten_learner_journey.py'
      - 'tools/audit_life_skills_routes.py'
      - 'tools/audit_stage_parity.py'
      - 'docs/life-skills-route-manifest.json'
      - '.github/workflows/kindergarten-source-audit.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inventory, link, identifier and JavaScript syntax checks
        run: python3 tools/audit_kindergarten.py > kindergarten-source-audit.json
      - name: Verify Kindergarten portfolio import identity protections
        run: python3 tools/audit_kindergarten_import_identity.py > kindergarten-import-identity-audit.json
      - name: Verify learner-journey source contracts
        run: python3 tools/audit_kindergarten_learner_journey.py > kindergarten-learner-journey-audit.json
      - name: Verify canonical stage/route manifest
        run: python3 tools/audit_life_skills_routes.py > life-skills-route-audit.json
      - name: Verify cross-stage parity baseline
        run: python3 tools/audit_stage_parity.py > life-skills-stage-parity.json
      - name: Preserve audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kindergarten-source-audit
          path: |
            kindergarten-source-audit.json
            kindergarten-import-identity-audit.json
            kindergarten-learner-journey-audit.json
            life-skills-route-audit.json
            life-skills-stage-parity.json
          if-no-files-found: warn
