name: No Page Regulator Regression
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/validate-no-page-regulator.mjs
      - run: node tools/validate-life-skills-landing-shell.mjs
      - name: Inventory remaining legacy page components (read only)
        run: node tools/audit-life-skills-page-chrome.mjs > life-skills-chrome-audit.json && node -e 'const r=require("./life-skills-chrome-audit.json"); console.log(JSON.stringify({status:r.status,counts:r.counts,affectedPages:r.affectedPages},null,2))'
      - uses: actions/upload-artifact@v4
        with:
          name: life-skills-chrome-audit
          path: life-skills-chrome-audit.json
