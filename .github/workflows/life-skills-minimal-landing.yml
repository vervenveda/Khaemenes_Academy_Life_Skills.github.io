name: Life Skills Minimal Landing

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/life-skills-minimal-landing-v1.css'
      - 'assets/life-skills-minimal-header-mount-v1.js'
      - 'assets/life-skills-landing-class-tools-v1.js'
      - 'tools/validate-life-skills-minimal-landing.mjs'
      - '.github/workflows/life-skills-minimal-landing.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'assets/life-skills-*'
      - 'tools/validate-life-skills-minimal-landing.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Life Skills minimal landing contract
        run: node tools/validate-life-skills-minimal-landing.mjs
      - name: Validate patch formatting
        run: git diff --check
