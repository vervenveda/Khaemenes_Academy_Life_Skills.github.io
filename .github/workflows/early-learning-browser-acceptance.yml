name: Life Skills early-learning browser acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'courses/**/preschool/**'
      - 'courses/kindergarten/**'
      - 'docs/life-skills-route-manifest.json'
      - 'qa/early-learning-browser-acceptance.mjs'
      - '.github/workflows/early-learning-browser-acceptance.yml'
  pull_request:
    paths:
      - 'courses/**/preschool/**'
      - 'courses/kindergarten/**'
      - 'docs/life-skills-route-manifest.json'
      - 'qa/early-learning-browser-acceptance.mjs'
      - '.github/workflows/early-learning-browser-acceptance.yml'

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser harness
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/life-skills-http.log 2>&1 &
          echo $! > /tmp/life-skills-http.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/life-skills-http.log
          exit 1
      - name: Run real Chromium acceptance
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: node qa/early-learning-browser-acceptance.mjs
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: early-learning-browser-acceptance
          path: |
            early-learning-browser-acceptance.json
          if-no-files-found: warn
